<div class="topbar">
  <div>
    <h1>Tableau de bord</h1>
    <p class="sub">Vue d'ensemble du système</p>
  </div>
</div>

<div class="stats">
  <div class="stat glass">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
    <div><div class="num">{{ total }}</div><div class="lbl">Membres du personnel</div></div>
  </div>
  <div class="stat glass">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg></div>
    <div><div class="num">{{ actifs }}</div><div class="lbl">Comptes actifs</div></div>
  </div>
  <div class="stat glass">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg></div>
    <div><div class="num">{{ medecins }}</div><div class="lbl">Médecins</div></div>
  </div>
</div>

<div class="panel glass">
  <div class="panel-head">
    <h3>Répartition du personnel par rôle</h3>
  </div>
  <div class="repartition">
    @for (item of repartition; track item.role) {
      <div class="ligne">
        <span class="role-nom">{{ item.role }}</span>
        <div class="barre">
          <div class="remplissage" [style.width.%]="total > 0 ? (item.nombre / total) * 100 : 0"></div>
        </div>
        <span class="role-nombre">{{ item.nombre }}</span>
      </div>
    }
  </div>
</div>
