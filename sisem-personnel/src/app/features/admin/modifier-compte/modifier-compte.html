<div class="bg"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="wrapper">
  <div class="form-head">
    <button class="back" routerLink="/admin/personnel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div>
      <h1>Modifier le compte</h1>
      <p class="sub">Mettez à jour les informations du membre</p>
    </div>
  </div>

  <div class="form-card glass">
    <div class="section-title">Informations du membre</div>
    <div class="grid">
      <div class="field">
        <label>Prénom</label>
        <input type="text" [(ngModel)]="prenom" name="prenom">
      </div>
      <div class="field">
        <label>Nom</label>
        <input type="text" [(ngModel)]="nom" name="nom">
      </div>
      <div class="field">
        <label>Email professionnel</label>
        <input type="email" [(ngModel)]="email" name="email">
      </div>
      <div class="field">
        <label>Téléphone</label>
        <input type="tel" [(ngModel)]="telephone" name="telephone">
      </div>
    </div>

    <div class="section-title">Rôle et affectation</div>
    <div class="grid">
      <div class="field">
        <label>Rôle <span class="opt">(non modifiable)</span></label>
        <select [(ngModel)]="role" name="role" disabled>
          <option value="secretaire">Secrétaire</option>
          <option value="technicien">Technicien</option>
          <option value="biologiste">Biologiste</option>
          <option value="major">Major</option>
          <option value="medecin">Médecin</option>
          <option value="admin">Administrateur</option>
        </select>
      </div>
      @if (besoinPavillon()) {
        <div class="field">
          <label>Pavillon</label>
          <select [(ngModel)]="pavillonId" name="pavillonId">
            <option value="">Sélectionner</option>
            @for (p of pavillons(); track p.id) {
              <option [value]="p.id">{{ p.nom }}</option>
            }
          </select>
        </div>
      }
      @if (role === 'medecin') {
        <div class="field">
          <label>Spécialité</label>
          <input type="text" [(ngModel)]="specialite" name="specialite" placeholder="Pédiatrie...">
        </div>
      }
    </div>

    @if (erreur()) {
      <p class="message-erreur">{{ erreur() }}</p>
    }

    <div class="actions">
      <button class="btn-ghost" routerLink="/admin/personnel">Annuler</button>
      <button class="btn-primary" (click)="enregistrer()" [disabled]="chargement()">
        {{ chargement() ? 'Enregistrement...' : 'Enregistrer les modifications' }}
      </button>
    </div>
  </div>
</div>
