<div class="bg"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="wrapper">
  <div class="form-head">
    <button class="back" [routerLink]="['/secretaire/patient', id]">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div>
      <h1>Modifier le patient</h1>
      <p class="sub">Corrigez les informations du patient</p>
    </div>
  </div>

  <div class="form-card glass">

    <div class="section-title">Informations personnelles</div>
    <div class="grid">
      <div class="field">
        <label>Prénom</label>
        <input type="text" [(ngModel)]="prenom" name="prenom">
      </div>
      <div class="field">
        <label>Nom</label>
        <input type="text" [(ngModel)]="nom" name="nom">
      </div>
      <div class="field">
        <label>Âge</label>
        <div class="age-groupe">
          <input type="number" min="0" [(ngModel)]="ageValeur" name="ageValeur" class="age-nombre">
          <select [(ngModel)]="ageUnite" name="ageUnite" class="age-unite">
            <option value="ans">ans</option>
            <option value="mois">mois</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Sexe</label>
        <select [(ngModel)]="sexe" name="sexe">
          <option value="">Sélectionner</option>
          <option value="M">Masculin</option>
          <option value="F">Féminin</option>
        </select>
      </div>
    </div>

    <div class="section-title">Coordonnées</div>
    <div class="grid">
      <div class="field">
        <label>Téléphone</label>
        <input type="tel" [(ngModel)]="telephone" name="telephone">
      </div>
      <div class="field">
        <label>Email <span class="opt">(optionnel)</span></label>
        <input type="email" [(ngModel)]="email" name="email">
      </div>
      <div class="field">
        <label>Adresse</label>
        <input type="text" [(ngModel)]="adresse" name="adresse">
      </div>
      <div class="field">
        <label>Ville</label>
        <input type="text" [(ngModel)]="ville" name="ville">
      </div>
    </div>

    @if (erreur()) {
      <p class="message-erreur">{{ erreur() }}</p>
    }

    <div class="actions">
      <button class="btn-ghost" [routerLink]="['/secretaire/patient', id]">Annuler</button>
      <button class="btn-primary" (click)="enregistrer()" [disabled]="chargement()">
        {{ chargement() ? 'Enregistrement...' : 'Enregistrer les modifications' }}
      </button>
    </div>

  </div>
</div>
