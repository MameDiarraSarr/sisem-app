<div class="bg"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="wrapper">
  <!-- En-tête avec retour -->
  <div class="form-head">
    <button class="back" routerLink="/secretaire">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div>
      <h1>Enregistrer un patient</h1>
      <p class="sub">Saisissez les informations à partir du bulletin</p>
    </div>
  </div>

  <!-- Le formulaire -->
  <div class="form-card glass">

    <div class="section-title">Informations personnelles</div>
    <div class="grid">
      <div class="field">
        <label>Prénom</label>
        <input type="text" placeholder="Amadou" [(ngModel)]="prenom" name="prenom">
      </div>
      <div class="field">
        <label>Nom</label>
        <input type="text" placeholder="Diop" [(ngModel)]="nom" name="nom">
      </div>
      <div class="field">
        <label>Âge</label>
        <div class="age-groupe">
          <input type="number" min="0" placeholder="8" [(ngModel)]="ageValeur" name="ageValeur" class="age-nombre">
          <select [(ngModel)]="ageUnite" name="ageUnite" class="age-unite">
            <option value="ans">ans</option>
            <option value="mois">mois</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Sexe</label>
        <select [(ngModel)]="sexe" name="sexe">
          <option value="">Sélectionner</option>
          <option value="M">Masculin</option>
          <option value="F">Féminin</option>
        </select>
      </div>
    </div>

    <div class="section-title">Coordonnées</div>
    <div class="grid">
      <div class="field">
        <label>Téléphone</label>
        <input type="tel" placeholder="77 123 45 67" [(ngModel)]="telephone" name="telephone">
      </div>
      <div class="field">
        <label>Email <span class="opt">(optionnel)</span></label>
        <input type="email" placeholder="exemple@mail.com" [(ngModel)]="email" name="email">
      </div>
      <div class="field">
        <label>Adresse</label>
        <input type="text" placeholder="Quartier, rue..." [(ngModel)]="adresse" name="adresse">
      </div>
      <div class="field">
        <label>Ville</label>
        <input type="text" placeholder="Dakar" [(ngModel)]="ville" name="ville">
      </div>
    </div>

    <div class="section-title">Type de patient</div>
    <div class="grid">
      <div class="field">
        <label>Patient</label>
        <select [(ngModel)]="typePatient" name="typePatient">
          <option value="">Sélectionner</option>
          <option value="interne">Interne</option>
          <option value="externe">Externe</option>
        </select>
      </div>
      @if (typePatient === 'interne') {
        <div class="field">
          <label>Pavillon</label>
          <select [(ngModel)]="pavillonId" name="pavillonId">
            <option value="">Sélectionner</option>
            @for (p of pavillons(); track p.id) {
              <option [value]="p.id">{{ p.nom }}</option>
            }
          </select>
        </div>
      }
    </div>

    @if (erreur()) {
      <p class="message-erreur">{{ erreur() }}</p>
    }

    <!-- Boutons -->
    <div class="actions">
      <button class="btn-ghost" routerLink="/secretaire">Annuler</button>
      <button class="btn-primary" (click)="enregistrer()" [disabled]="chargement()">
        {{ chargement() ? 'Enregistrement...' : 'Enregistrer le patient' }}
      </button>
    </div>

  </div>
</div>
