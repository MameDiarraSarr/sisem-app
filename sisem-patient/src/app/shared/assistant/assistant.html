<!-- Bouton flottant -->
<button class="fab" (click)="basculerPanneau()" [class.actif]="ouvert()">
  @if (ouvert()) {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  } @else {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  }
</button>

<!-- Panneau -->
@if (ouvert()) {
  <div class="voile" (click)="fermer()"></div>

  <div class="panneau">
    <!-- En-tête -->
    <div class="tete">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="titre">
        <b>Assistant SISEM</b>
        <span>Il explique, il ne diagnostique pas</span>
      </div>
      <button class="fermer" (click)="fermer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="messages" #zoneMessages>
      @for (m of messages(); track $index) {
        <div class="msg" [class.bot]="m.auteur === 'bot'" [class.patient]="m.auteur === 'patient'">
          <div class="bulle">
            <p>{{ m.texte }}</p>
            @if (m.auteur === 'bot') {
              <button class="haut-parleur" (click)="lire(m.texte)" title="Écouter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                Écouter
              </button>
            }
          </div>
        </div>
      }

      @if (enTrainDeParler()) {
        <button class="stop" (click)="arreterLecture()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          Arrêter la lecture
        </button>
      }
    </div>

    <!-- Questions suggérées -->
    <div class="suggestions">
      <span class="sugg-lbl">Questions fréquentes</span>
      <div class="puces">
        @for (q of questionsSuggerees; track q.id) {
          <button class="puce" (click)="poserQuestion(q)">{{ q.question }}</button>
        }
      </div>
    </div>

    <!-- Saisie -->
    <div class="saisie">
      <input placeholder="Posez votre question..."
             [value]="saisie()"
             (input)="onSaisie($any($event.target).value)"
             (keyup.enter)="envoyer()">
      <button class="envoyer" (click)="envoyer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/></svg>
      </button>
    </div>
  </div>
}
