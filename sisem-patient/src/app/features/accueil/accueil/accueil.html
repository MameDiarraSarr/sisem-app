<div class="page">
  <div class="hello">
    <h1>Bonjour {{ patient?.prenom }} </h1>
    <p>Voici vos résultats d'examens</p>
  </div>

  <div class="resultats">
    @for (resultat of resultats; track resultat.id) {
      <div class="carte glass" [routerLink]="['/resultat', resultat.id]">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>
        <div class="infos">
          <b>{{ resultat.examenNom }}</b>
          <span>N° {{ resultat.numeroLabo }} · {{ resultat.dateResultat }}</span>
        </div>
        <div class="badge">Disponible</div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    } @empty {
      <div class="vide glass">
        <p>Vous n'avez aucun résultat disponible pour le moment.</p>
      </div>
    }
  </div>
</div>
