<div class="page">
  <div class="entete">
    <h1>Mon profil</h1>
  </div>

  @if (patient) {
    <div class="carte-profil glass">
      <div class="avatar">{{ initiales() }}</div>
      <h2>{{ patient.prenom }} {{ patient.nom }}</h2>
      <span class="role">Patient</span>
    </div>

    <div class="infos glass">
      <div class="ligne">
        <span class="lbl">Téléphone</span>
        <span class="val">{{ patient.telephone }}</span>
      </div>
      <div class="ligne">
        <span class="lbl">Identifiant patient</span>
        <span class="val">#{{ patient.id }}</span>
      </div>
    </div>

    <button class="btn-mdp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Changer mon mot de passe
    </button>

    <button class="btn-out" (click)="seDeconnecter()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      Déconnexion
    </button>
  }
</div>
