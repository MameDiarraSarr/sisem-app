<div class="bg"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="login-wrap">
  <div class="card">
    <div class="logo">
      <div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#B3CFE5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 5 4-12 2 7h6"/></svg></div>
      <span class="bn">SISEM</span>
    </div>

    <h1>Mot de passe oublié</h1>
    <p class="sub">Saisissez votre numéro de téléphone pour recevoir un lien de réinitialisation</p>

    @if (message()) {
      <div class="succes">{{ message() }}</div>
    } @else {
      <div class="field">
        <label>Numéro de téléphone</label>
        <input type="tel" placeholder="77 123 45 67" [(ngModel)]="telephone" name="telephone" (keyup.enter)="envoyer()">
      </div>

      @if (erreur()) {
        <div class="erreur">{{ erreur() }}</div>
      }

      <button class="btn-connexion" (click)="envoyer()" [disabled]="chargement()">
        {{ chargement() ? 'Envoi...' : 'Envoyer le lien' }}
      </button>
    }

    <p class="foot"><a routerLink="/login">Retour à la connexion</a></p>
  </div>
</div>
